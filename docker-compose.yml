version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: jobs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
  redis:
    image: redis:6
    ports:
      - '6379:6379'
  web:
    build: .
    command: gunicorn jobs_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: jobs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: your_key_here
  worker:
    build: .
    command: celery -A jobs_project worker -Q fifo_jobs --loglevel=info
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: jobs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: your_key_here
volumes:
  postgres_data:
